<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 1rem; }
  header { display: flex; justify-content: space-between; align-items: center; }
  #library { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: .25rem; }
  .card h2 { margin: 0; font-size: 1rem; }
  .card p { margin: 0; font-size: .85rem; color: #555; }
  .read { color: green; font-weight: bold; }
  .unread { color: red; font-weight: bold; }
  .card-actions { display: flex; gap: .5rem; margin-top: .5rem; }
  .card-actions button { flex: 1; padding: .3rem; cursor: pointer; }
  dialog { border-radius: 8px; }
  #book-form { display: flex; flex-direction: column; gap: .5rem; }
  #book-form label { display: flex; flex-direction: column; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <h1>My Library</h1>
  <button id="new-book-btn">New Book</button>
</header>

<main id="library"></main>

<dialog id="book-dialog">
  <form id="book-form">
    <label>Title <input name="title" required></label>
    <label>Author <input name="author" required></label>
    <label>Pages <input name="pages" type="number" min="1" required></label>
    <label>Year <input name="year" type="number" min="0" required></label>
    <label style="flex-direction: row; align-items: center; gap: .5rem;">
      <input name="read" type="checkbox"> Read
    </label>
    <div style="display:flex; gap:.5rem; justify-content:flex-end;">
      <button type="button" id="cancel-btn">Cancel</button>
      <button type="submit">Add</button>
    </div>
  </form>
</dialog>

<script>
const myLibrary = [];

function Book(title, author, pages, year, read) {
  this.id = crypto.randomUUID();
  this.title = title;
  this.author = author;
  this.pages = pages;
  this.year = year;
  this.read = read;
}

Book.prototype.toggleRead = function () {
  this.read = !this.read;
};

function addBookToLibrary(title, author, pages, year, read) {
  myLibrary.push(new Book(title, author, pages, year, read));
}

const libraryEl = document.getElementById('library');

function renderLibrary() {
  libraryEl.innerHTML = '';
  for (const book of myLibrary) {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = book.id;
    card.innerHTML = `
      <h2>${book.title}</h2>
      <p>by ${book.author}</p>
      <p>${book.pages} pages · ${book.year}</p>
      <p class="${book.read ? 'read' : 'unread'}">${book.read ? 'Read' : 'Unread'}</p>
      <div class="card-actions">
        <button data-action="toggle">Toggle</button>
        <button data-action="remove">Remove</button>
      </div>`;
    libraryEl.appendChild(card);
  }
}

libraryEl.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.closest('[data-id]').dataset.id;
  const book = myLibrary.find(b => b.id === id);

  if (btn.dataset.action === 'remove') myLibrary.splice(myLibrary.indexOf(book), 1);
  else book.toggleRead();

  renderLibrary();
});

const dialog = document.getElementById('book-dialog');
const form = document.getElementById('book-form');

document.getElementById('new-book-btn').addEventListener('click', () => {
  form.reset();
  dialog.showModal();
});

document.getElementById('cancel-btn').addEventListener('click', () => dialog.close());

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const d = new FormData(form);
  addBookToLibrary(
    d.get('title').trim(),
    d.get('author').trim(),
    Number(d.get('pages')),
    Number(d.get('year')),
    d.get('read') === 'on'
  );
  dialog.close();
  renderLibrary();
});

// seed
addBookToLibrary('The Hobbit', 'J.R.R. Tolkien', 310, 1937, true);
renderLibrary();
</script>
</body>
</html>
